appId: com.mobile
env:
  IDENTITY_NAME: e2e-mobile-id
  IDENTITY_PASSWORD: Smoke-test-password1
---
- runFlow: helpers/clear-and-launch.yaml
- runFlow:
    file: helpers/set-server.yaml
    env:
      SERVER_URL: ${SERVER_URL}
- runFlow:
    file: helpers/create-hd-identity.yaml
    env:
      IDENTITY_NAME: ${IDENTITY_NAME}
      IDENTITY_PASSWORD: ${IDENTITY_PASSWORD}
- extendedWaitUntil:
    visible:
      id: "identity-fingerprint"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "identity-open-publish"
    timeout: 20000
- tapOn:
    id: "identity-open-publish"
- extendedWaitUntil:
    visible:
      id: "identity-publish"
    timeout: 20000
- tapOn:
    id: "identity-publish"
- runFlow:
    file: helpers/unlock-identity.yaml
    env:
      IDENTITY_PASSWORD: definitely-wrong-password
- extendedWaitUntil:
    visible: "Wrong password.*"
    timeout: 60000
- assertNotVisible:
    id: "identity-published"
- tapOn:
    id: "identity-publish"
- runFlow: helpers/unlock-identity.yaml
- extendedWaitUntil:
    visible:
      id: "identity-published"
    timeout: 120000
- assertNotVisible:
    id: "identity-publish"
- back
- extendedWaitUntil:
    visible:
      id: "identity-published"
    timeout: 20000
- assertNotVisible:
    id: "identity-open-publish"
