appId: com.mobile
---
- tapOn: "More"
- extendedWaitUntil:
    visible:
      id: "more-settings"
    timeout: 10000
- tapOn:
    id: "more-settings"
- extendedWaitUntil:
    visible:
      id: "settings-server-url"
    timeout: 10000
- tapOn:
    id: "settings-server-url"
# selectTextOnFocus highlights the default URL; one Backspace removes it.
# eraseText then covers leftover characters if selection did not apply.
- pressKey: Backspace
- eraseText: 120
- inputText: ${SERVER_URL}
# Prefer Save over hideKeyboard: with some IMEs hideKeyboard fails hard
# when the keyboard is already dismissed after inputText.
- tapOn:
    id: "settings-save"
- extendedWaitUntil:
    visible: "Saved"
    timeout: 10000
- back
# Prefer visible tab label — resource-id can miss after Settings pops the stack.
- extendedWaitUntil:
    visible: "Identities"
    timeout: 15000
- tapOn: "Identities"
- extendedWaitUntil:
    visible:
      id: "tab-identities"
    timeout: 10000
