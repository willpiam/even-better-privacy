appId: com.mobile
env:
  MAIL_USERNAME: e2e-onboard
  IDENTITY_PASSWORD: Smoke-test-password1
---
# Onboarding wizard: address -> password -> recovery phrase -> confirm -> create.
# The runner's key server has MAIL_SIGNUP_ENABLED with an unreachable Stalwart,
# so keys + publish succeed and the mailbox step reports a mail-server error.
- runFlow: helpers/clear-and-launch.yaml
- runFlow:
    file: helpers/set-server.yaml
    env:
      SERVER_URL: ${SERVER_URL}
- extendedWaitUntil:
    visible:
      id: "identities-onboarding-empty"
    timeout: 15000
- tapOn:
    id: "identities-onboarding-empty"
- extendedWaitUntil:
    visible: "Get a quantum-secure email address"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "onboarding-start"
      enabled: true
    timeout: 20000
- tapOn:
    id: "onboarding-start"
- extendedWaitUntil:
    visible:
      id: "onboarding-username"
    timeout: 15000
- tapOn:
    id: "onboarding-username"
- inputText: "ab"
- extendedWaitUntil:
    visible: ".*at least 3.*"
    timeout: 10000
- eraseText: 10
- inputText: ${MAIL_USERNAME}
- hideKeyboard
- extendedWaitUntil:
    visible: ".*is available"
    timeout: 15000
- tapOn:
    id: "onboarding-address-next"
- extendedWaitUntil:
    visible:
      id: "onboarding-password"
    timeout: 10000
- tapOn:
    id: "onboarding-password"
- inputText: ${IDENTITY_PASSWORD}
- tapOn:
    id: "onboarding-password-confirm"
- inputText: ${IDENTITY_PASSWORD}
- hideKeyboard
- tapOn:
    id: "onboarding-password-next"
