appId: com.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "tab-identities"
    timeout: 30000
- assertVisible:
    id: "tab-identities"
- assertVisible: "Identities"

# More hub + About EBP
- tapOn: "More"
- extendedWaitUntil:
    visible:
      id: "more-about"
    timeout: 15000
- tapOn:
    id: "more-about"
- extendedWaitUntil:
    visible:
      id: "project-info-body"
    timeout: 10000
- assertVisible: "How It Works"
- back

# Settings toggles + save
- tapOn:
    id: "more-settings"
- extendedWaitUntil:
    visible:
      id: "settings-server-url"
    timeout: 10000
- assertVisible: "Settings"
- tapOn:
    id: "settings-enforce-password-policy"
- tapOn:
    id: "settings-mail-render-html"
- tapOn:
    id: "settings-mail-include-public-keys"
- tapOn:
    id: "settings-save"
- extendedWaitUntil:
    visible: "Saved"
    timeout: 10000
