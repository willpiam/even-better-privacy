<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    F-WEB-01 / F-WEB-03: strict Content-Security-Policy. The verifier
    imports `@noble/post-quantum` directly from esm.sh for browser-side
    signature verification; `connect-src` allows the configured server
    (default: ebp-cqyo.onrender.com) plus esm.sh's CDN for the ES
    modules. Inline scripts and styles are forbidden.
  -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self' https://esm.sh; style-src 'self'; img-src 'self' https://raw.githubusercontent.com; connect-src 'self' https://esm.sh https://ebp-cqyo.onrender.com; form-action 'self'; base-uri 'none'">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="no-referrer">
  <title>EBP Signature Verifier</title>
  <meta
    name="description"
    content="Verify EBP signatures and check whether signer identities are published on the EBP server."
  />
  <meta property="og:title" content="EBP Signature Verifier" />
  <meta property="og:description" content="Verify EBP signatures in the browser. Check whether signer identities are published on the EBP server." />
  <meta property="og:image" content="https://raw.githubusercontent.com/willpiam/even-better-privacy/master/assets/tiny-logo.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="EBP Signature Verifier" />
  <meta name="twitter:description" content="Verify EBP signatures in the browser." />
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/willpiam/even-better-privacy/master/assets/tiny-logo.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="hero">
    <nav class="top-nav container">
      <div class="brand">
        <span>EBP Signature Verifier</span>
      </div>
      <a class="button subtle" href="./index.html">Back to EBP</a>
    </nav>
  </header>

  <main class="container panel">
    <h1 class="verifier-title">Verify Signature</h1>
    <p class="lead">
      Paste or upload a signature payload and optional public identity file. Detached signatures require a message. Signed files (<code>ebp-signed-file</code>) require uploading the file being verified.
    </p>

    <section class="card verifier-card">
      <div class="form-grid">
        <label>
          Server URL
          <input id="server-url" type="text" value="https://ebp-cqyo.onrender.com" />
          <small class="input-help">First request may take a moment if the server is waking up.</small>
        </label>
        <label>
          Signature JSON file
          <input id="payload-file" type="file" accept=".json,application/json" />
        </label>
        <label>
          File to verify (for ebp-signed-file)
          <input id="verify-file" type="file" />
        </label>
        <label>
          Public identity JSON file (optional)
          <input id="public-file" type="file" accept=".json,application/json" />
        </label>
      </div>

      <label>
        Signature payload JSON
        <textarea id="payload-json" rows="10" placeholder='{"type":"ebp-signed-message","message":"...","messageHash":"...","salt":"...","signature":"...","fingerprint":"..."}'></textarea>
      </label>

      <label>
        Public identity JSON (optional)
        <textarea id="public-json" rows="8" placeholder='{"fingerprint":"...","signingKeyType":"...","signingKey":"...","signingKeyDetails":{"variant":"..."}}'></textarea>
      </label>

      <label>
        Message (for detached signatures)
        <textarea id="message" rows="6" placeholder="Original message text"></textarea>
      </label>

      <label id="reconstructed-label" class="is-hidden">
        Reconstructed signed message (for signed files)
        <textarea id="file-reconstructed-message" rows="4" readonly placeholder="Shown when verifying ebp-signed-file payloads."></textarea>
      </label>

      <div class="actions">
        <button class="button primary" id="verify-btn" type="button">Verify</button>
        <button class="button subtle" id="clear-btn" type="button">Clear All</button>
      </div>
    </section>

    <section class="card verifier-card" id="result-section">
      <h2>Result</h2>
      <p id="result-summary" class="section-lead">No verification run yet.</p>
      <pre id="result-json"><code>{}</code></pre>
      <div id="signer-details"></div>
    </section>
  </main>

  <!-- F-WEB-03: inline scripts are forbidden by the CSP above. The
       "Clear All" button handler is wired up in verify.js via
       resetVerifierForm(). -->
  <script type="module" src="./verify.js?v=8"></script>
</body>
</html>
