<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>EBP Mail Accounts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <img src="tiny-logo.png" alt="" class="logo" />
        <div>
          <div class="title">EBP Mail</div>
          <div class="subtitle">Active local account</div>
        </div>
      </header>

      <section class="card">
        <div class="label">Current account</div>
        <div id="currentIdentity" class="current-value">Loading...</div>
      </section>

      <section class="card">
        <label for="identitySelect" class="label">Switch to another local account</label>
        <select id="identitySelect"></select>
        <button id="switchButton" type="button">Switch account</button>
      </section>

      <div id="status" class="status" aria-live="polite"></div>

      <footer class="footer">
        <a id="openOptions" href="#">Open extension settings</a>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
