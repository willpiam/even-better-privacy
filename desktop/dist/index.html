<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Even Better Privacy</title>
    <style>
      :root { color-scheme: light; --page: #f4f7f0; --ink: #24392e; --muted: #626f65; --accent: #466039; --line: #e1e6da; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--page); color: var(--ink); font: 13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; display: grid; place-items: center; min-height: 100dvh; }
      .loader { max-width: 420px; padding: 40px 28px; text-align: center; }
      .brand-mark { display: grid; place-items: center; width: 54px; height: 60px; background: #285e47; color: #fffefa; border-radius: 16px 16px 16px 5px; font: italic 45px/1 Georgia,serif; letter-spacing: -4px; padding-right: 4px; margin: 0 auto 24px; }
      .eyebrow { font-size: 9px; letter-spacing: 2px; color: var(--muted); }
      h1 { font-size: 26px; line-height: 1.3; font-weight: 600; letter-spacing: -.7px; margin: 10px 0 8px; }
      .subtitle { color: var(--muted); margin: 0 0 32px; }
      .status { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-size: 12px; }
      .spinner { display: inline-block; width: 15px; height: 15px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
      button { margin-top: 20px; padding: 10px 18px; background: var(--accent); color: #fffefa; border: 0; border-radius: 9px; font: inherit; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
      [hidden] { display: none !important; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --page: #17221e; --ink: #e2eade; --muted: #a4b1a6; --accent: #b2d6a8; --line: #35483c; } button { color: #17221e; } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
  </head>
  <body>
    <main class="loader">
      <div class="brand-mark" aria-hidden="true">e.</div>
      <span class="eyebrow">YOUR SPACE. YOUR KEYS.</span>
      <h1>Even Better Privacy</h1>
      <p class="subtitle">A little more peace of mind.</p>
      <div class="status" role="status" aria-live="polite"><span class="spinner" id="spinner" aria-hidden="true"></span><span id="status">Opening your workspace…</span></div>
      <button type="button" id="retry" hidden>Try again</button>
    </main>
    <script src="./loader.js"></script>
  </body>
</html>
