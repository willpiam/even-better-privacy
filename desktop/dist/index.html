<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EBP</title>
  <style>
    body {
      margin: 0;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 0.9rem; color: #8b949e; }
    .error  { color: #f85149; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status">Starting local backend…</div>
  </div>
  <script>
    const BACKEND = "http://127.0.0.1:8787";
    const MAX_ATTEMPTS = 30;
    const DELAY_MS = 500;

    async function waitForBackend() {
      const status = document.getElementById("status");
      for (let i = 1; i <= MAX_ATTEMPTS; i++) {
        try {
          const res = await fetch(BACKEND + "/api/v1/health");
          if (res.ok) {
            window.location.replace(BACKEND);
            return;
          }
        } catch (_) {
          // not ready yet
        }
        status.textContent = "Starting local backend… (" + i + "/" + MAX_ATTEMPTS + ")";
        await new Promise(r => setTimeout(r, DELAY_MS));
      }
      document.getElementById("spinner").style.display = "none";
      status.className = "status error";
      status.textContent = "Could not reach local backend at " + BACKEND + ". Is the sidecar running?";
    }

    waitForBackend();
  </script>
</body>
</html>
