name: Application contracts
on:
  push:
  pull_request:
jobs:
  deno:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        task: [test:core, test:cli-utils, test:gui-backend, test:server]
    env:
      DB_TYPE: sqlite
      DENO_SQLITE_PATH: /usr/lib/x86_64-linux-gnu/libsqlite3.so.0
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: deno task ${{ matrix.task }}
      - if: matrix.task == 'test:core'
        run: npm run test:review-contracts
  mobile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile
      - run: npm --prefix mobile test -- --runInBand --watchAll=false
  android-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools platforms;android-36 build-tools;36.0.0
            ndk;27.1.12297006 cmake;3.22.1
      - run: npm ci --prefix mobile
      - run: ./build_mobile_android.sh --skip-npm --arch x86_64
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and restore the minified APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/test_android_release_launch.sh dist/mobile/ebp-mobile-release.apk
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review-local
          POSTGRES_DB: review
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U review" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_TYPE: psql
      PG_HOST: 127.0.0.1
      PG_PORT: '5432'
      PG_USER: review
      PG_PASSWORD: review-local
      PG_DATABASE: review
      HOLISTIC_TEST_POSTGRES: 'true'
      RUN_POSTGRES_ATOMICITY: 'true'
      PAYMENT_TEST_POSTGRES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-read --allow-write --allow-env --allow-net --allow-sys=hostname server/tests/holistic_remediation_test.ts server/tests/state_atomicity_postgres_test.ts server/payments/orders_postgres_test.ts
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: deno task desktop:backend:build
      - run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
