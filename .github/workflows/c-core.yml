name: C core interoperability
on:
  push:
  pull_request:

jobs:
  interoperability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libargon2-dev libutf8proc-dev libjansson4
      # Ubuntu's default OpenSSL may be too old for the current PQ algorithms.
      - name: Build pinned OpenSSL 3.5.7
        run: |
          git clone --depth 1 --branch openssl-3.5.7 https://github.com/openssl/openssl.git "$RUNNER_TEMP/openssl-src"
          test "$(git -C "$RUNNER_TEMP/openssl-src" rev-parse HEAD)" = 8cf17aaeb4599f8af87fefd810b5b5fee90fe69e
          cd "$RUNNER_TEMP/openssl-src"
          ./Configure --prefix="$RUNNER_TEMP/openssl" --libdir=lib shared
          make -j2
          make install_sw
          echo "CPPFLAGS=-I$RUNNER_TEMP/openssl/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$RUNNER_TEMP/openssl/lib -Wl,-rpath,$RUNNER_TEMP/openssl/lib" >> "$GITHUB_ENV"
          echo "EBP_EXPECT_OPENSSL_VERSION=OpenSSL 3.5.7" >> "$GITHUB_ENV"
      - name: Verify the website crypto bundle
        run: |
          npm ci --prefix tools/website-crypto
          npm run check:website-crypto
      - name: Test TypeScript core and shared logic
        run: deno task test:core
      - name: Build and test C, Python, and TypeScript interoperability
        run: |
          env -u LD_LIBRARY_PATH deno task test:c-core
          LD_LIBRARY_PATH="$RUNNER_TEMP/openssl/lib" deno test --allow-run=python3 --allow-read --allow-env c-core/tests/interop_test.ts
          if readelf -d c-core/libebp_core.so | grep -q libjansson; then exit 1; fi
          if nm -D c-core/libebp_core.so | grep -Eq ' (json_|jsonp_|jansson_)'; then exit 1; fi
      - name: Test the website verifier in Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
          env -u LD_LIBRARY_PATH npm run test:website-browser
      - name: Run native address and undefined behavior checks
        run: make -C c-core sanitize
      - name: Build and smoke-test the Python wheel
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1
          python setup.py sdist --dist-dir "$RUNNER_TEMP/ebp-sdist"
          python -m pip wheel --no-build-isolation --no-deps "$RUNNER_TEMP"/ebp-sdist/ebp_core-*.tar.gz -w "$RUNNER_TEMP/ebp-wheels"
          python -c 'import glob,sys,zipfile; w=glob.glob(sys.argv[1]+"/ebp_core-*.whl")[0]; names=zipfile.ZipFile(w).namelist(); assert all(any(n.endswith(p) for n in names) for p in ("licenses/LICENSE", "licenses/c-core/vendor/jansson/LICENSE", "licenses/c-core/vendor/ryu/LICENSE"))' "$RUNNER_TEMP/ebp-wheels"
          python -m venv "$RUNNER_TEMP/ebp-wheel-test"
          "$RUNNER_TEMP/ebp-wheel-test/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/ebp-wheels/ebp_core-*.whl
          cd "$RUNNER_TEMP"
          wheel_native=$("$RUNNER_TEMP/ebp-wheel-test/bin/python" -c 'import ebp_core._native; print(ebp_core._native.__file__)')
          if readelf -d "$wheel_native" | grep -q libjansson; then exit 1; fi
          if nm -D "$wheel_native" | grep -Eq ' (json_|jsonp_|jansson_)'; then exit 1; fi
          LD_PRELOAD=libjansson.so.4 "$RUNNER_TEMP/ebp-wheel-test/bin/python" -c 'import ebp_core, ebp_core._native, json; assert ebp_core.sha256(b"abc").hex().startswith("ba7816bf"); assert ebp_core.canonicalize_json("{\"2\":2,\"10\":1}") == "{\"10\":1,\"2\":2}"; envelope=ebp_core.create_file_envelope(b"abc", "a.bin"); assert ebp_core.parse_file_envelope(json.dumps(envelope))["fileBytes"] == b"abc"; a=ebp_core.Identity.from_variants(ebp_core.ML_DSA_44, ebp_core.ML_KEM_512); b=ebp_core.Identity(); packet=a.sign_and_encrypt_many("hello", [b]); assert b.decrypt_and_verify_many(packet, a)["verified"]; a.close(); b.close()'
