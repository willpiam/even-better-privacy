[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebp-core"
version = "0.1.0"
description = "Python bindings for the experimental EBP C core"
readme = "python/README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0 AND dtoa"
license-files = ["LICENSE", "c-core/vendor/jansson/LICENSE", "c-core/vendor/ryu/LICENSE"]
